<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt Builder — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#1f2328;
    --muted:#6e7781;
    --faint:#8c959f;
    --border:#d0d7de;
    --border-soft:#e4e8ec;
    --gutter:#f6f8fa;
    --line-hl:#dbeafe;
    --blue:#0969da;
    --blue-soft:#ddf4ff;
    --red:#cf222e;
    --red-soft:#ffe1e1;
    --green:#1a7f37;
    --green-soft:#d6f5de;
    --num:#0550ae;
    --pill-bg:#eaeef3;
    --pill-ink:#57606a;
    --lint:#e5534b;
    --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#f4f5f7;
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.45;
    padding:40px 20px;
  }
  .stage{
    max-width:740px;
    margin:0 auto;
    background:var(--bg);
    border-radius:14px;
    padding:24px 26px 30px;
    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 30px rgba(31,35,40,.06);
  }
  .label{font-weight:600;font-size:14px;margin:0 0 12px}

  /* ---- top prompt pills ---- */
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .pills.hidden{display:none}
  .pill-chip{
    display:flex;flex-direction:column;justify-content:center;
    min-width:84px;padding:6px 14px;
    border:1px solid var(--border);border-radius:16px;background:#fff;
    cursor:pointer;transition:border-color .12s, box-shadow .12s, transform .12s;
    line-height:1.15;
  }
  .pill-chip:hover{border-color:#aeb6bf;box-shadow:0 1px 4px rgba(31,35,40,.08)}
  .pill-chip:active{transform:translateY(1px)}
  .pill-chip .pc-key{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink)}
  .pill-chip .pc-type{font-size:9.5px;letter-spacing:.09em;font-weight:600;color:var(--faint);margin-top:2px}
  .pill-add{
    display:flex;align-items:center;justify-content:center;
    width:34px;border:1px dashed var(--border);border-radius:16px;background:#fff;
    color:var(--muted);font-size:20px;cursor:pointer;line-height:1;
    transition:border-color .12s, color .12s, background .12s;
  }
  .pill-add:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}

  /* ---- add-a-prompt card ---- */
  .add-card{
    border:1px dashed var(--border);border-radius:10px;
    padding:16px 18px;margin-bottom:16px;background:#fcfcfd;
  }
  .add-card h3{margin:0 0 14px;font-size:13.5px;font-weight:600}
  .add-row{display:flex;flex-wrap:wrap;gap:14px}
  .add-opt{
    flex:1 1 0;min-width:160px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:14px 12px 16px;border:1px solid var(--border-soft);border-radius:14px;background:#fff;
    cursor:pointer;transition:border-color .14s, box-shadow .14s, background .14s, transform .14s;
  }
  .add-opt:hover{border-color:#8fc3f5;background:#fbfdff;box-shadow:0 4px 16px rgba(9,105,218,.10)}
  .add-opt:active{transform:translateY(1px)}
  .add-opt .illo{width:100%;max-width:150px;height:auto;display:block}
  .add-btn{
    font-family:var(--sans);font-size:13px;
    padding:6px 14px;border:1px solid var(--border);border-radius:18px;background:#fff;
    color:var(--blue);cursor:pointer;pointer-events:none;transition:background .12s, border-color .12s;
  }
  .add-opt:hover .add-btn{background:var(--blue-soft);border-color:#8fc3f5}

  /* illustration elements */
  .brain-fill{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.8;stroke-linejoin:round}
  .brain-fold{fill:none;stroke:var(--blue);stroke-width:1.3;stroke-linecap:round;opacity:.5}
  .ln-link{stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;fill:none}
  .node{fill:#fff;stroke:var(--blue);stroke-width:1.8}
  .score-track{fill:url(#scoreGrad)}
  .knob{fill:#fff;stroke:var(--blue);stroke-width:1.9}
  .knob-dot{fill:var(--blue)}
  .res-yes{fill:var(--green-soft);stroke:var(--green);stroke-width:1.9}
  .mark-yes{stroke:var(--green);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .res-no{fill:var(--red-soft);stroke:var(--red);stroke-width:1.9}
  .mark-no{stroke:var(--red);stroke-width:2.2;stroke-linecap:round;fill:none}

  /* ---- editor ---- */
  .editor{
    border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;
  }
  .editor.hidden,.add-card.hidden{display:none}
  .code{
    font-family:var(--mono);font-size:12.5px;line-height:20px;
    max-height:560px;overflow:auto;padding:6px 0;
  }
  .row{display:flex;align-items:flex-start;white-space:pre}
  .row.hl{background:var(--line-hl)}
  .row .ln{
    flex:0 0 34px;text-align:right;padding-right:6px;color:var(--muted);
    user-select:none;font-size:11.5px;
  }
  .row .fold{
    flex:0 0 14px;text-align:center;color:var(--muted);cursor:pointer;
    user-select:none;font-size:11px;
  }
  .row .fold.empty{cursor:default}
  .row .lint{flex:0 0 16px;text-align:center;user-select:none}
  .row .lint .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lint);vertical-align:middle}
  .row .co{padding-right:18px}

  /* token colors */
  .t-punct{color:#24292f}
  .t-key{color:#1f2328}
  .t-str{color:var(--red)}
  .t-num{color:var(--num)}
  .t-ellipsis{color:var(--muted);padding:0 4px}
  .editable{cursor:text;border-radius:3px}
  .editable:hover{background:#fff3cd66}

  .chip-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--pill-bg);color:var(--pill-ink);
    border-radius:10px;padding:0 8px;margin:0 1px;height:16px;line-height:16px;
    font-size:10.5px;letter-spacing:.04em;font-weight:600;text-transform:uppercase;
    cursor:pointer;vertical-align:baseline;transition:background .12s;white-space:nowrap;
  }
  .chip-pill:hover{background:#dde3ea}
  .chip-pill .pen{font-size:10px;opacity:.7}
  .inline-input{
    font-family:var(--mono);font-size:12.5px;color:var(--red);
    border:1px solid var(--blue);border-radius:3px;padding:0 3px;margin:0 1px;
    background:#fff;outline:none;min-width:40px;
  }

  /* ---- toolbar ---- */
  .toolbar{
    display:flex;align-items:center;gap:14px;
    padding:7px 12px;border-top:1px solid var(--border-soft);
    background:#fafbfc;font-size:12px;color:var(--muted);
  }
  .toolbar .count{font-variant-numeric:tabular-nums}
  .toolbar .scroll{flex:1;height:6px}
  .toolbar .scroll .thumb{height:6px;width:96px;background:#d6dbe0;border-radius:3px;margin:0 auto}
  .toolbar label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .toolbar .fmt{
    font-family:var(--sans);font-size:12px;padding:3px 12px;border:1px solid var(--border);
    border-radius:6px;background:#fff;color:var(--ink);cursor:pointer;
  }
  .toolbar .fmt:hover{background:#f3f4f6}

  /* ---- + popover ---- */
  .menu{
    position:absolute;z-index:20;background:#fff;border:1px solid var(--border);
    border-radius:12px;box-shadow:0 8px 28px rgba(31,35,40,.14);
    padding:8px;display:flex;flex-direction:column;gap:8px;
  }
  .menu.hidden{display:none}
  .menu button{
    font-family:var(--sans);font-size:13px;text-align:center;
    padding:6px 14px;border:1px solid var(--border);border-radius:18px;background:#fff;
    color:var(--blue);cursor:pointer;transition:background .12s, border-color .12s;
  }
  .menu button:hover{background:var(--blue-soft);border-color:#8fc3f5}
  .menu button:active{transform:translateY(1px)}
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="scoreGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#d4e9ff"/>
        <stop offset="1" stop-color="#0969da"/>
      </linearGradient>
      <symbol id="brain" viewBox="0 0 44 40">
        <path class="brain-fill" d="M15 7 c4-4 12-4 15 1 c6-1 10 4 8 9 c3 3 1 9-3 10 c-1 5-8 7-12 4 c-4 3-11 1-12-4 c-5-1-7-7-3-11 c-2-5 2-10 7-9 Z"/>
        <path class="brain-fold" d="M22 8 c-3 3 0 6-2 9 c-2 3 1 6-1 9"/>
        <path class="brain-fold" d="M14 14 c3 1 4 4 3 7"/>
        <path class="brain-fold" d="M30 13 c-3 1-4 5-3 8"/>
      </symbol>
    </defs>
  </svg>

  <div class="stage">
    <p class="label">Prompts</p>
    <div class="pills" id="pills"></div>
    <div class="add-card" id="addCard">
      <h3>Start by adding a prompt</h3>
      <div class="add-row">

        <div class="add-opt" data-type="labeling">
          <svg class="illo" viewBox="0 0 130 84" fill="none" aria-hidden="true">
            <use href="#brain" x="4" y="22" width="48" height="44"/>
            <path class="ln-link" d="M49 43 C72 38 86 21 99 19"/>
            <path class="ln-link" d="M50 43 C74 43 88 43 99 43"/>
            <path class="ln-link" d="M49 43 C72 48 86 65 99 67"/>
            <circle class="node" cx="106" cy="19" r="7"/>
            <circle class="node" cx="108" cy="43" r="7"/>
            <circle class="node" cx="106" cy="67" r="7"/>
          </svg>
          <button class="add-btn" tabindex="-1">Add Labeling prompt</button>
        </div>

        <div class="add-opt" data-type="score">
          <svg class="illo" viewBox="0 0 130 84" fill="none" aria-hidden="true">
            <use href="#brain" x="0" y="22" width="48" height="44"/>
            <path class="ln-link" d="M45 43 H58"/>
            <rect class="score-track" x="56" y="40" width="68" height="6" rx="3"/>
            <circle class="knob" cx="94" cy="43" r="8.5"/>
            <circle class="knob-dot" cx="94" cy="43" r="2.4"/>
          </svg>
          <button class="add-btn" tabindex="-1">Add Score prompt</button>
        </div>

        <div class="add-opt" data-type="yes_no">
          <svg class="illo" viewBox="0 0 130 84" fill="none" aria-hidden="true">
            <use href="#brain" x="2" y="22" width="48" height="44"/>
            <path class="ln-link" d="M48 39 C64 31 79 27 90 25"/>
            <path class="ln-link" d="M48 47 C64 55 79 60 90 62"/>
            <circle class="res-yes" cx="103" cy="25" r="12"/>
            <path class="mark-yes" d="M97 25 l4 4 l8 -9"/>
            <circle class="res-no" cx="103" cy="62" r="12"/>
            <path class="mark-no" d="M98 57 l10 10 M108 57 l-10 10"/>
          </svg>
          <button class="add-btn" tabindex="-1">Add Yes/No prompt</button>
        </div>

      </div>
    </div>

    <div class="editor hidden" id="editor">
      <div class="code" id="code"></div>
      <div class="toolbar">
        <span class="count" id="count">0 prompts</span>
        <div class="scroll"><div class="thumb"></div></div>
        <label><input type="checkbox" id="lintToggle" checked> Lint</label>
        <button class="fmt" id="fmtBtn">Format</button>
      </div>
    </div>
  </div>

  <div class="menu hidden" id="menu">
    <button data-type="labeling">Add Labeling prompt</button>
    <button data-type="score">Add Score prompt</button>
    <button data-type="yes_no">Add Yes/No prompt</button>
  </div>

<script>
/* ---------------- model ---------------- */
const TYPE_LABEL = { labeling:'LABELING', score:'SCORE', yes_no:'YES/NO' };
const PH = {
  labeling_instructions:"What is the choice that's being made.",
  labeling_option:"name this option",
  labeling_description:"describe what characterizes this option",
  score_instructions:"describe what makes a low score, and what makes a high score",
  score_description:"describe this score",
  yes_no_instructions:"put in a yes/no question (ending with a question mark).",
  yes_no_description:"describe this question",
};

const counters = { labeling:0, score:0, yes_no:0 };
const prompts = [];
const collapsed = new Set();   // collapsed opener line indices
let lintOn = true;
let hlLine = -1;               // highlighted line index

function makePrompt(type){
  counters[type]++;
  const key = type + '_' + counters[type];
  if(type==='labeling')
    return { type, key, instructions:'', options:[{option:'',description:''},{option:'',description:''}] };
  if(type==='score')
    return { type, key, instructions:'', scores:[{score:1,description:''},{score:2,description:''}] };
  return { type, key, instructions:'', description:'' };
}
function addPrompt(type){ prompts.push(makePrompt(type)); collapsed.clear(); render(); }

/* ---------------- line builder ---------------- */
let fields = [];  // id -> {obj, prop}

function buildLines(){
  fields = [];
  const lines = [];
  const push = (indent, tokens, opts={}) =>
    lines.push(Object.assign({ indent, tokens, foldEnd:null, placeholder:false }, opts));

  const punct = t => ({c:'t-punct', text:t});
  const key   = t => ({c:'t-key',   text:'"'+t+'"'});
  const strV  = t => ({c:'t-str',   text:'"'+t+'"'});
  const numV  = t => ({c:'t-num',   text:String(t)});

  // a string field that is either a filled value or an editable placeholder pill
  function field(indent, name, obj, prop, phKey, comma){
    const id = fields.length;
    fields.push({obj, prop});
    const val = obj[prop];
    const toks = [ key(name), punct(': ') ];
    if(val && val.length){
      toks.push({c:'t-str', text:'"', plain:true});
      toks.push({c:'t-str editable', text:val, edit:id});
      toks.push({c:'t-str', text:'"', plain:true});
    }else{
      toks.push({c:'t-str', text:'"', plain:true});
      toks.push({pill:true, edit:id, label:PH[phKey]});
      toks.push({c:'t-str', text:'"', plain:true});
    }
    if(comma) toks.push(punct(','));
    push(indent, toks, {placeholder: !(val&&val.length)});
  }

  push(0, [punct('[')], {fold:true});
  prompts.forEach((p, pi) => {
    const last = pi === prompts.length-1;
    push(1, [punct('{')], {fold:true});
    push(2, [key('key'),  punct(': '), strV(p.key),  punct(',')]);
    push(2, [key('type'), punct(': '), strV(p.type), punct(',')]);

    if(p.type==='labeling'){
      field(2,'instructions', p,'instructions','labeling_instructions', true);
      push(2, [key('options'), punct(': '), punct('[')], {fold:true});
      p.options.forEach((o, oi) => {
        const lo = oi===p.options.length-1;
        push(3, [punct('{')], {fold:true});
        field(4,'option', o,'option','labeling_option', true);
        field(4,'description', o,'description','labeling_description', false);
        push(3, [punct(lo?'}':'},')]);
      });
      push(2, [punct(']')]);
    } else if(p.type==='score'){
      field(2,'instructions', p,'instructions','score_instructions', true);
      push(2, [key('scores'), punct(': '), punct('[')], {fold:true});
      p.scores.forEach((s, si) => {
        const ls = si===p.scores.length-1;
        push(3, [punct('{')], {fold:true});
        push(4, [key('score'), punct(': '), numV(s.score), punct(',')]);
        field(4,'description', s,'description','score_description', false);
        push(3, [punct(ls?'}':'},')]);
      });
      push(2, [punct(']')]);
    } else {
      field(2,'instructions', p,'instructions','yes_no_instructions', true);
      field(2,'description',  p,'description','yes_no_description', false);
    }
    push(1, [punct(last?'}':'},')]);
  });
  push(0, [punct(']')]);

  // match folds (well-nested): openers carry fold:true, closers start with } or ]
  const stack = [];
  lines.forEach((ln, i) => {
    const first = ln.tokens[0] && ln.tokens[0].text || '';
    if(/^[}\]]/.test(first) && stack.length){
      const o = stack.pop();
      lines[o].foldEnd = i;
    }
    if(ln.fold) stack.push(i);
  });
  return lines;
}

/* ---------------- render ---------------- */
function closeBracketText(line){ // text of the matching closer line
  return line.tokens[0].text;
}

function render(){
  const has = prompts.length>0;
  document.getElementById('editor').classList.toggle('hidden', !has);
  document.getElementById('pills').classList.toggle('hidden', !has);
  document.getElementById('addCard').classList.toggle('hidden', has);
  renderPills();
  if(has) renderCode();
}

function renderPills(){
  const wrap = document.getElementById('pills');
  wrap.innerHTML = '';
  prompts.forEach((p, i) => {
    const c = document.createElement('div');
    c.className = 'pill-chip';
    c.innerHTML = `<span class="pc-key">${p.key}</span><span class="pc-type">${TYPE_LABEL[p.type]}</span>`;
    c.title = 'Scroll to this prompt';
    c.onclick = () => focusPrompt(i);
    wrap.appendChild(c);
  });
  const add = document.createElement('div');
  add.className = 'pill-add';
  add.textContent = '+';
  add.title = 'Add a prompt';
  add.onclick = (e) => openMenu(e.currentTarget);
  wrap.appendChild(add);
}

function renderCode(){
  const lines = buildLines();
  const hidden = new Array(lines.length).fill(false);
  collapsed.forEach(o => {
    if(lines[o] && lines[o].foldEnd!=null)
      for(let i=o+1;i<=lines[o].foldEnd;i++) hidden[i]=true;
  });

  const code = document.getElementById('code');
  code.innerHTML = '';
  lines.forEach((ln, i) => {
    if(hidden[i]) return;
    const row = document.createElement('div');
    row.className = 'row' + (i===hlLine ? ' hl' : '');

    const ln_ = document.createElement('span'); ln_.className='ln'; ln_.textContent=i+1;
    const fold = document.createElement('span'); fold.className='fold';
    if(ln.foldEnd!=null && ln.foldEnd>i){
      const isCol = collapsed.has(i);
      fold.textContent = isCol ? '›' : '⌄'; // › or ⌄
      fold.onclick = () => { isCol ? collapsed.delete(i) : collapsed.add(i); render(); };
    } else { fold.classList.add('empty'); }

    const lint = document.createElement('span'); lint.className='lint';
    if(lintOn && ln.placeholder) lint.innerHTML = '<span class="dot"></span>';

    const co = document.createElement('span'); co.className='co';
    co.appendChild(document.createTextNode('  '.repeat(ln.indent)));
    ln.tokens.forEach(t => co.appendChild(tokenEl(t, i)));

    // collapsed opener: show ellipsis + matching closing bracket
    if(collapsed.has(i) && ln.foldEnd!=null){
      const el = document.createElement('span'); el.className='t-ellipsis'; el.textContent='…';
      co.appendChild(el);
      const cb = document.createElement('span'); cb.className='t-punct';
      cb.textContent = closeBracketText(lines[ln.foldEnd]);
      co.appendChild(cb);
    }

    row.append(ln_, fold, lint, co);
    code.appendChild(row);
  });

  document.getElementById('count').textContent =
    prompts.length + (prompts.length===1 ? ' prompt' : ' prompts');
}

function tokenEl(t, lineIdx){
  if(t.pill){
    const s = document.createElement('span');
    s.className = 'chip-pill';
    s.innerHTML = `<span class="pen">✎</span>${t.label}`;
    s.onclick = () => beginEdit(t.edit, lineIdx, s, '');
    return s;
  }
  const s = document.createElement('span');
  s.className = t.c;
  s.textContent = t.text;
  if(t.edit!=null && !t.plain){
    s.onclick = () => beginEdit(t.edit, lineIdx, s, fields[t.edit].obj[fields[t.edit].prop]);
  }
  return s;
}

/* ---------------- editing ---------------- */
function beginEdit(id, lineIdx, el, current){
  hlLine = lineIdx;
  const f = fields[id];
  const inp = document.createElement('input');
  inp.className = 'inline-input';
  inp.value = current || '';
  inp.size = Math.max((current||'').length, 10);
  el.replaceWith(inp);
  inp.focus(); inp.select();
  let done=false;
  const commit = () => { if(done) return; done=true; f.obj[f.prop]=inp.value.trim(); render(); };
  inp.addEventListener('keydown', e => {
    if(e.key==='Enter'){ e.preventDefault(); commit(); }
    else if(e.key==='Escape'){ done=true; render(); }
  });
  inp.addEventListener('input', () => { inp.size = Math.max(inp.value.length, 10); });
  inp.addEventListener('blur', commit);
}

function focusPrompt(i){
  // highlight the opening "{" line of prompt i
  const lines = buildLines();
  let seen=-1;
  for(let k=0;k<lines.length;k++){
    if(lines[k].indent===1 && lines[k].tokens[0].text==='{'){ seen++; if(seen===i){ hlLine=k; break; } }
  }
  render();
  const hl = document.querySelector('.row.hl');
  if(hl) hl.scrollIntoView({block:'center', behavior:'smooth'});
}

/* ---------------- + menu ---------------- */
const menu = document.getElementById('menu');
function openMenu(anchor){
  const r = anchor.getBoundingClientRect();
  menu.style.left = (window.scrollX + r.left) + 'px';
  menu.style.top  = (window.scrollY + r.bottom + 6) + 'px';
  menu.classList.remove('hidden');
}
menu.querySelectorAll('button').forEach(b =>
  b.onclick = () => { menu.classList.add('hidden'); addPrompt(b.dataset.type); });
document.addEventListener('click', e => {
  if(!menu.contains(e.target) && !e.target.classList.contains('pill-add'))
    menu.classList.add('hidden');
});

/* ---------------- wiring ---------------- */
document.querySelectorAll('.add-opt').forEach(o =>
  o.onclick = () => addPrompt(o.dataset.type));
document.getElementById('lintToggle').onchange = e => { lintOn = e.target.checked; renderCode(); };
document.getElementById('fmtBtn').onclick = () => { collapsed.clear(); render(); };

render();
</script>
</body>
</html>
